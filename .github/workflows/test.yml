name: Test

on:
  push:
    branches: [main]
  pull_request:

# The repo default is already read-only, but declaring it here pins the
# grant in-repo: a change to the repository setting can't silently widen
# what these jobs can do.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# head_ref (PR source branch) falls back to ref (push), so push + PR runs for
# one branch share a group instead of running twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reliable gate: the Swift Testing unit suite must pass.
  unit:
    name: Unit tests
    # MemoryEcho targets the iOS 26 SDK, which needs Xcode 26 (macOS 26).
    # Adjust this label if the runner image isn't available yet.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The macos-26 runner image intermittently ships Xcode without the
      # matching iOS Simulator runtime pre-installed (see
      # https://github.com/actions/runner-images/issues/13220), which makes
      # xcodebuild report zero concrete simulator destinations. Fetch the
      # runtime on demand instead of failing the whole job.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            echo "No iOS simulator runtime found — downloading it..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      - name: Run unit tests
        run: make test-unit

  # UI tests are slower / flakier, so they run in their own job and don't
  # block the unit gate. They're too slow to run on every PR push, so they're
  # a post-merge validation only: skipped on `pull_request`, run on pushes to
  # main.
  ui:
    name: UI tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # See the "Ensure iOS Simulator runtime is installed" step in the unit
      # job for why this is needed.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            echo "No iOS simulator runtime found — downloading it..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      - name: Run UI tests
        run: make test-ui
