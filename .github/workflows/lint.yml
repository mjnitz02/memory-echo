name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# head_ref (PR source branch) falls back to ref (push), so push + PR runs for
# one branch share a group instead of running twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Pinned tool versions — the source of truth for local installs too, so bump
# these and `make install-tools` together. Unpinned `brew install` used to land
# here, which meant an upstream release could turn a new rule on by default and
# fail a PR that changed nothing (0.62.0's wrapIfStatementBodies did exactly
# that). Renovate/Dependabot won't touch these; bump them by hand.
env:
  SWIFTFORMAT_VERSION: 0.62.1
  SWIFTLINT_VERSION: 0.65.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint:
    name: SwiftLint + SwiftFormat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree.
          fetch-depth: 0

      # Official release binaries rather than Homebrew: brew only ever installs
      # current stable, so it can't be pinned. Both zips hold the executable at
      # the archive root.
      - name: Install pinned tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" -d "$tools"
          unzip -qo "$RUNNER_TEMP/swiftlint.zip" -d "$tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$tools" gitleaks
          chmod +x "$tools/swiftformat" "$tools/swiftlint" "$tools/gitleaks"
          echo "$tools" >> "$GITHUB_PATH"

      # Printed so a version-drift failure is obvious in the log instead of
      # looking like the code regressed.
      - name: Report tool versions
        run: |
          swiftformat --version
          swiftlint version
          gitleaks version

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Scan for leaked secrets
        run: make secrets-scan
