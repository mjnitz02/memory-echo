name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot PRs. This workflow doesn't
# merge anything itself: GitHub does, and only once branch protection is
# satisfied — the required checks (lint + unit tests) are green and the branch
# is up to date with main. A red PR just sits open like it always did.
on: pull_request

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    # Keyed on the PR author rather than github.actor, which is whoever
    # triggered this particular run and changes on a manual re-run.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Dependabot-triggered runs get a read-only token unless the workflow
      # asks for more. Merging needs both of these.
      contents: write
      pull-requests: write
    steps:
      # No checkout: nothing from the PR branch is executed with the write
      # token, only the preinstalled gh CLI.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
