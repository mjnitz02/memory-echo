# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# One group spanning every ecosystem, so a week's version updates arrive as a
# single PR instead of one per dependency (codeql-action's init and analyze
# used to open a matched pair every week). dependabot-automerge.yml merges that
# PR once the required checks pass.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "swift"
    directory: "/MemoryEchoCore"
    # `patterns` is required on every member of a multi-ecosystem group.
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    # Nobody reviews these PRs before they merge, so wait a week after a
    # release: time for a compromised or broken version to be yanked upstream.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
